<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages — decode step.
      // https://github.com/rafgraph/spa-github-pages
      // Reverses the redirect done by public/404.html, restoring the real
      // deep-link URL (e.g. /career-roadmap/civil-engineering) via
      // history.replaceState before the app mounts and reads window.location.
      // On any host other than GitHub Pages this is a harmless no-op.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EVLab — Engineering Visual Lab: a digital engineering ecosystem connecting career guidance, engineering knowledge, software, learning, resources, projects, and real-world engineering exploration."
    />
    <title>EVLab — Engineering Visual Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
