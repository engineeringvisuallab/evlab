<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="disc-elec-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#00F0FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <ellipse cx="80" cy="125" rx="60" ry="22" fill="#20180B" stroke="#F59E0B" stroke-width="1.5"/>
  <ellipse cx="80" cy="125" rx="60" ry="22" fill="url(#disc-elec-glow)" opacity="0.8"/>
  <ellipse cx="80" cy="120" rx="45" ry="16" fill="#0F172A" stroke="#FDE047" stroke-width="1"/>

  <!-- High Voltage Bolt & Grid Node -->
  <g transform="translate(48, 25)">
    <!-- Substation Base Pad -->
    <polygon points="10,60 55,45 70,65 25,80" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    
    <!-- 3D Lightning Energy Bolt -->
    <polygon points="45,5 15,40 35,40 20,75 55,35 35,35" fill="url(#bolt-grad)" stroke="#FFFFFF" stroke-width="1.5" filter="drop-shadow(0 0 10px #F59E0B)"/>
  </g>
</svg>
