<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="disc-gis-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="80" cy="125" rx="60" ry="22" fill="#0B132B" stroke="#00F0FF" stroke-width="1.5"/>
  <ellipse cx="80" cy="125" rx="60" ry="22" fill="url(#disc-gis-glow)" opacity="0.8"/>
  <ellipse cx="80" cy="120" rx="45" ry="16" fill="#13243F" stroke="#38BDF8" stroke-width="1"/>

  <!-- Miniature 3D Globe with Mapping Mesh -->
  <g transform="translate(45, 25)">
    <circle cx="35" cy="45" r="32" fill="#0F172A" stroke="#00F0FF" stroke-width="1.8"/>
    <ellipse cx="35" cy="45" rx="32" ry="12" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="3 3"/>
    <ellipse cx="35" cy="45" rx="14" ry="32" fill="none" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="3 3"/>

    <!-- Orbital Ring -->
    <ellipse cx="35" cy="45" rx="42" ry="16" fill="none" stroke="#00F0FF" stroke-width="1.5" transform="rotate(-30 35 45)"/>
    <circle cx="70" cy="30" r="3" fill="#00F0FF" filter="drop-shadow(0 0 6px #00F0FF)"/>
    <circle cx="28" cy="40" r="2.5" fill="#10B981"/>
    <circle cx="45" cy="52" r="2.5" fill="#F59E0B"/>
  </g>
</svg>
