<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="disc-agri-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disc-agri-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
  </defs>

  <!-- Glowing Pedestal Base -->
  <ellipse cx="80" cy="125" rx="60" ry="22" fill="#06281E" stroke="#10B981" stroke-width="1.8"/>
  <ellipse cx="80" cy="125" rx="60" ry="22" fill="url(#disc-agri-glow)" opacity="0.8"/>
  <ellipse cx="80" cy="120" rx="45" ry="16" fill="#042F2E" stroke="#34D399" stroke-width="1.2"/>

  <!-- Miniature 3D Agricultural Engineering Diorama -->
  <g transform="translate(35, 30)">
    <!-- Terraced Crop Field Geometry -->
    <polygon points="10,40 50,20 85,38 45,60" fill="url(#disc-agri-grad)" stroke="#34D399" stroke-width="1.5"/>
    <line x1="20" y1="40" x2="60" y2="24" stroke="#064E3B" stroke-width="1.5"/>
    <line x1="30" y1="46" x2="70" y2="30" stroke="#064E3B" stroke-width="1.5"/>

    <!-- Irrigation Water Channel & Sluice -->
    <path d="M 5 50 Q 40 40 85 55" fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" filter="drop-shadow(0 0 4px #00F0FF)"/>

    <!-- Irrigation Pump Station Unit -->
    <g transform="translate(60, 20)">
      <polygon points="5,0 18,5 18,18 5,12" fill="#1E293B" stroke="#10B981" stroke-width="1.2"/>
      <circle cx="12" cy="6" r="1.5" fill="#00F0FF"/>
    </g>

    <!-- Growing Bio-Engineered Crop Stalk -->
    <g transform="translate(25, 10)">
      <path d="M 18 35 Q 18 15 22 5" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
      <path d="M 22 5 Q 32 0 30 10 Q 22 15 20 12" fill="#10B981" stroke="#34D399" stroke-width="1"/>
      <path d="M 19 18 Q 8 12 12 22 Q 18 22 19 18" fill="#10B981" stroke="#34D399" stroke-width="1"/>
    </g>
  </g>
</svg>
