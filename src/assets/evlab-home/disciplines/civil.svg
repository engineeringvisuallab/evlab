<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="disc-civil-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="80" cy="125" rx="60" ry="22" fill="#0E1B2D" stroke="#38BDF8" stroke-width="1.5"/>
  <ellipse cx="80" cy="125" rx="60" ry="22" fill="url(#disc-civil-glow)" opacity="0.8"/>
  <ellipse cx="80" cy="120" rx="45" ry="16" fill="#1E293B" stroke="#00F0FF" stroke-width="1"/>

  <!-- Miniature 3D Suspension Bridge & Truss -->
  <g transform="translate(30, 40)">
    <!-- Bridge Roadway -->
    <polygon points="10,65 90,30 100,45 20,80" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <!-- Pylons -->
    <polygon points="50,10 56,12 56,65 50,62 44,65 44,12" fill="#334155" stroke="#00F0FF" stroke-width="1.8"/>
    <circle cx="50" cy="10" r="3" fill="#00F0FF" filter="drop-shadow(0 0 6px #00F0FF)"/>

    <!-- Stay Cables -->
    <line x1="50" y1="22" x2="20" y2="70" stroke="#38BDF8" stroke-width="1.2"/>
    <line x1="50" y1="35" x2="32" y2="66" stroke="#38BDF8" stroke-width="1.2"/>
    <line x1="50" y1="22" x2="80" y2="40" stroke="#38BDF8" stroke-width="1.2"/>
    <line x1="50" y1="35" x2="68" y2="46" stroke="#38BDF8" stroke-width="1.2"/>
  </g>
</svg>
