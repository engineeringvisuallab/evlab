<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="disc-urban-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disc-urban-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
  </defs>

  <ellipse cx="80" cy="125" rx="60" ry="22" fill="#15132A" stroke="#8B5CF6" stroke-width="1.5"/>
  <ellipse cx="80" cy="125" rx="60" ry="22" fill="url(#disc-urban-glow)" opacity="0.8"/>
  <ellipse cx="80" cy="120" rx="45" ry="16" fill="#1E1B4B" stroke="#C084FC" stroke-width="1"/>

  <!-- Miniature 3D Smart City Cluster -->
  <g transform="translate(42, 35)">
    <!-- Central Tower -->
    <polygon points="25,5 40,15 40,75 25,82 10,75 10,15" fill="url(#disc-urban-grad)" stroke="#E9D5FF" stroke-width="1.5"/>
    <polygon points="25,5 40,15 25,82" fill="#A855F7" opacity="0.6"/>
    <line x1="25" y1="5" x2="25" y2="-5" stroke="#00F0FF" stroke-width="2"/>
    <circle cx="25" cy="-5" r="2.5" fill="#00F0FF" filter="drop-shadow(0 0 6px #00F0FF)"/>

    <!-- Left Building Block -->
    <polygon points="5,30 18,38 18,72 5,65" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.2"/>
    
    <!-- Right Building Block -->
    <polygon points="45,25 60,35 60,75 45,68" fill="#1E1B4B" stroke="#38BDF8" stroke-width="1.2"/>
  </g>
</svg>
