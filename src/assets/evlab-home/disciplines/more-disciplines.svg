<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="disc-more-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="80" cy="125" rx="60" ry="22" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <ellipse cx="80" cy="125" rx="60" ry="22" fill="url(#disc-more-glow)" opacity="0.8"/>
  <ellipse cx="80" cy="120" rx="45" ry="16" fill="#1E293B" stroke="#00F0FF" stroke-width="1"/>

  <!-- Modular 3D Engineering Cubes / Interconnected Polyhedron -->
  <g transform="translate(42, 30)">
    <!-- Top Cube -->
    <g transform="translate(18, 0)">
      <polygon points="20,0 36,8 20,16 4,8" fill="#38BDF8" stroke="#00F0FF" stroke-width="1.2"/>
      <polygon points="4,8 20,16 20,32 4,24" fill="#0369A1" stroke="#00F0FF" stroke-width="1.2"/>
      <polygon points="20,16 36,8 36,24 20,32" fill="#0284C7" stroke="#00F0FF" stroke-width="1.2"/>
    </g>
    <!-- Bottom Left Cube -->
    <g transform="translate(0, 26)">
      <polygon points="20,0 36,8 20,16 4,8" fill="#A855F7" stroke="#C084FC" stroke-width="1.2"/>
      <polygon points="4,8 20,16 20,32 4,24" fill="#6B21A8" stroke="#C084FC" stroke-width="1.2"/>
      <polygon points="20,16 36,8 36,24 20,32" fill="#7C3AED" stroke="#C084FC" stroke-width="1.2"/>
    </g>
    <!-- Bottom Right Cube -->
    <g transform="translate(36, 26)">
      <polygon points="20,0 36,8 20,16 4,8" fill="#34D399" stroke="#10B981" stroke-width="1.2"/>
      <polygon points="4,8 20,16 20,32 4,24" fill="#047857" stroke="#10B981" stroke-width="1.2"/>
      <polygon points="20,16 36,8 36,24 20,32" fill="#059669" stroke="#10B981" stroke-width="1.2"/>
    </g>
  </g>
</svg>
