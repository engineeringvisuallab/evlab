<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <radialGradient id="gis-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <filter id="gis-bloom">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="500" height="400" fill="#0A101D" rx="16"/>
  <circle cx="250" cy="200" r="180" fill="url(#gis-glow)"/>

  <!-- Pedestal Base -->
  <ellipse cx="250" cy="290" rx="190" ry="75" fill="#0E1B2E" stroke="#00F0FF" stroke-width="2"/>
  <ellipse cx="250" cy="275" rx="160" ry="60" fill="#13243F" stroke="#38BDF8" stroke-width="1.5"/>

  <!-- Digital Globe / Spatial Coordinate Grid -->
  <g transform="translate(170, 70)">
    <circle cx="80" cy="80" r="75" fill="#0B132B" stroke="#00F0FF" stroke-width="2"/>
    <!-- Latitude & Longitude Arcs -->
    <ellipse cx="80" cy="80" rx="75" ry="30" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <ellipse cx="80" cy="80" rx="75" ry="55" fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.6"/>
    <ellipse cx="80" cy="80" rx="35" ry="75" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- Orbital Satellite Track -->
    <ellipse cx="80" cy="80" rx="100" ry="40" fill="none" stroke="#00F0FF" stroke-width="1.8" transform="rotate(-25 80 80)" filter="url(#gis-bloom)"/>
    <!-- Satellite Icon -->
    <circle cx="170" cy="40" r="4" fill="#00F0FF" filter="url(#gis-bloom)"/>
    <!-- Spatial Coordinate Pins -->
    <circle cx="60" cy="70" r="3" fill="#10B981" filter="url(#gis-bloom)"/>
    <circle cx="110" cy="85" r="3" fill="#F59E0B" filter="url(#gis-bloom)"/>
    <circle cx="85" cy="50" r="3" fill="#C084FC" filter="url(#gis-bloom)"/>
  </g>

  <!-- Topographic Contour Traces -->
  <path d="M 80 280 Q 250 210 420 280" fill="none" stroke="#00F0FF" stroke-width="2" stroke-dasharray="8 6"/>
  <path d="M 120 290 Q 250 240 380 290" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4"/>
</svg>
