<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <radialGradient id="trans-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <filter id="trans-bloom">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="500" height="400" fill="#0A101D" rx="16"/>
  <circle cx="250" cy="200" r="180" fill="url(#trans-glow)"/>

  <!-- Pedestal Base -->
  <ellipse cx="250" cy="290" rx="190" ry="75" fill="#132035" stroke="#38BDF8" stroke-width="2"/>
  <ellipse cx="250" cy="275" rx="160" ry="60" fill="#1E293B" stroke="#00F0FF" stroke-width="1.5"/>

  <!-- Cable-Stayed Bridge Deck -->
  <g transform="translate(60, 100)">
    <!-- Roadway Slab -->
    <polygon points="20,180 260,60 360,110 120,230" fill="#1E293B" stroke="#00F0FF" stroke-width="2"/>
    <!-- Yellow Median -->
    <line x1="70" y1="205" x2="310" y2="85" stroke="#FDE047" stroke-width="2" stroke-dasharray="10 8"/>

    <!-- Pylon Tower -->
    <polygon points="170,10 180,15 180,190 170,185 160,190 160,15" fill="#334155" stroke="#00F0FF" stroke-width="2"/>
    <circle cx="170" cy="10" r="4" fill="#00F0FF" filter="url(#trans-bloom)"/>

    <!-- Stay Cables Left -->
    <line x1="170" y1="35" x2="80" y2="180" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="170" y1="65" x2="110" y2="165" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="170" y1="95" x2="140" y2="150" stroke="#38BDF8" stroke-width="1.5"/>

    <!-- Stay Cables Right -->
    <line x1="170" y1="35" x2="260" y2="90" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="170" y1="65" x2="230" y2="105" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="170" y1="95" x2="200" y2="120" stroke="#38BDF8" stroke-width="1.5"/>

    <!-- Light Trail Stream -->
    <line x1="90" y1="195" x2="160" y2="160" stroke="#00F0FF" stroke-width="3.5" stroke-linecap="round" filter="url(#trans-bloom)"/>
    <line x1="220" y1="130" x2="290" y2="95" stroke="#F43F5E" stroke-width="3.5" stroke-linecap="round" filter="url(#trans-bloom)"/>
  </g>
</svg>
