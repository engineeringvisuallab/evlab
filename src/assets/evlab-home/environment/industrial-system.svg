<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <radialGradient id="ind-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <filter id="ind-bloom">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="500" height="400" fill="#0A101D" rx="16"/>
  <circle cx="250" cy="200" r="180" fill="url(#ind-glow)"/>

  <ellipse cx="250" cy="290" rx="190" ry="75" fill="#1B1E29" stroke="#38BDF8" stroke-width="2"/>
  <ellipse cx="250" cy="275" rx="160" ry="60" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>

  <!-- Distillation Columns -->
  <g transform="translate(140, 80)">
    <polygon points="20,0 40,10 40,150 20,160 0,150 0,10" fill="#1E293B" stroke="#00F0FF" stroke-width="1.5"/>
    <polygon points="20,0 40,10 20,160" fill="#0284C7" opacity="0.6"/>
    <line x1="20" y1="0" x2="20" y2="-12" stroke="#F43F5E" stroke-width="2"/>
    <circle cx="20" cy="-12" r="3" fill="#F43F5E" filter="url(#ind-bloom)"/>
  </g>

  <g transform="translate(200, 60)">
    <polygon points="20,0 40,10 40,170 20,180 0,170 0,10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <polygon points="20,0 40,10 20,180" fill="#0369A1" opacity="0.6"/>
    <line x1="20" y1="0" x2="20" y2="-12" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="20" cy="-12" r="3" fill="#F59E0B" filter="url(#ind-bloom)"/>
  </g>

  <!-- Spherical Pressure Storage Vessel -->
  <g transform="translate(280, 150)">
    <circle cx="35" cy="35" r="30" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <ellipse cx="35" cy="35" rx="28" ry="12" fill="none" stroke="#00F0FF" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="18" y1="55" x2="12" y2="85" stroke="#64748B" stroke-width="3"/>
    <line x1="52" y1="55" x2="58" y2="85" stroke="#64748B" stroke-width="3"/>
  </g>

  <!-- Pipe Run Interconnects -->
  <path d="M 180 180 L 220 180 L 220 200 L 280 200" fill="none" stroke="#00F0FF" stroke-width="3.5" filter="url(#ind-bloom)"/>
</svg>
