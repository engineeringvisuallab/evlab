<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="mailGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mailBaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="envGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="envFlapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="150" cy="120" r="110" fill="url(#mailGlow)"/>

  <!-- 3D Pedestal Base -->
  <ellipse cx="150" cy="180" rx="90" ry="30" fill="#0b1329" stroke="#0284c7" stroke-width="2"/>
  <ellipse cx="150" cy="175" rx="80" ry="25" fill="#0f1d3d" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <ellipse cx="150" cy="170" rx="65" ry="20" fill="#132752" stroke="#38bdf8" stroke-width="1"/>

  <!-- Hologram rings -->
  <ellipse cx="150" cy="140" rx="75" ry="20" stroke="#0284c7" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="150" cy="100" rx="85" ry="22" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,6" opacity="0.5"/>

  <!-- 3D Floating Isometric Envelope Body -->
  <g transform="translate(60, 45)">
    <!-- Envelope Shadow -->
    <path d="M 10 100 L 90 135 L 170 100 L 90 65 Z" fill="#0369a1" opacity="0.3"/>

    <!-- Main Envelope Glass Back -->
    <path d="M 15 45 L 90 90 L 165 45 L 90 0 Z" fill="#0284c7" opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Letter Paper popping out -->
    <g transform="translate(30, 0)">
      <path d="M 0 35 L 60 70 L 120 35 L 60 0 Z" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M 20 28 L 55 48 L 75 36" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
      <path d="M 30 38 L 65 58 L 90 44" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round"/>
      <path d="M 40 48 L 70 65 L 85 56" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Main Envelope Front Faces -->
    <path d="M 15 45 L 90 90 L 15 85 Z" fill="url(#envGrad)" opacity="0.9" stroke="#7dd3fc" stroke-width="1"/>
    <path d="M 165 45 L 90 90 L 165 85 Z" fill="url(#envGrad)" opacity="0.8" stroke="#7dd3fc" stroke-width="1"/>
    <path d="M 15 85 L 90 90 L 165 85 L 90 130 Z" fill="url(#envGrad)" stroke="#38bdf8" stroke-width="2"/>

    <!-- Glowing Open Top Flap -->
    <path d="M 15 45 L 90 0 L 165 45 Z" fill="url(#envFlapGrad)" opacity="0.75" stroke="#bae6fd" stroke-width="2"/>
    <path d="M 90 0 L 90 45" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Glowing Particles / Flying Messages -->
  <circle cx="95" cy="50" r="3" fill="#38bdf8"/>
  <circle cx="210" cy="65" r="2.5" fill="#7dd3fc"/>
  <circle cx="230" cy="110" r="3.5" fill="#38bdf8"/>
  <circle cx="65" cy="120" r="2" fill="#0284c7"/>
  <path d="M 190 40 Q 220 30 235 55" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2,2" fill="none"/>
  <path d="M 75 75 Q 50 60 60 40" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2,2" fill="none"/>
</svg>
