<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <radialGradient id="mod-uele-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <filter id="uele-bloom">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="320" height="200" fill="#0A101D" rx="12"/>
  <circle cx="160" cy="100" r="100" fill="url(#mod-uele-glow)"/>

  <!-- Pedestal Ring Base -->
  <ellipse cx="160" cy="165" rx="90" ry="25" fill="#0A1E2B" stroke="#00F0FF" stroke-width="1.8"/>
  <ellipse cx="160" cy="160" rx="70" ry="18" fill="#0E2D3F" stroke="#34D399" stroke-width="1.2"/>

  <!-- Holographic 3D Digital Twin Globe -->
  <g transform="translate(110, 40)">
    <circle cx="50" cy="50" r="48" fill="#081A2A" stroke="#00F0FF" stroke-width="2"/>
    <!-- Wireframe Longitudes & Latitudes -->
    <ellipse cx="50" cy="50" rx="48" ry="18" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="4 3"/>
    <ellipse cx="50" cy="50" rx="48" ry="34" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.6"/>
    <ellipse cx="50" cy="50" rx="22" ry="48" fill="none" stroke="#10B981" stroke-width="1.2" stroke-dasharray="4 3"/>

    <!-- Orbital Hologram Ring with Satellite Node -->
    <ellipse cx="50" cy="50" rx="65" ry="24" fill="none" stroke="#00F0FF" stroke-width="1.8" transform="rotate(-20 50 50)" filter="url(#uele-bloom)"/>
    <circle cx="110" cy="30" r="3.5" fill="#00F0FF" filter="url(#uele-bloom)"/>
    <!-- Surface Hotspots -->
    <circle cx="40" cy="45" r="3" fill="#10B981" filter="url(#uele-bloom)"/>
    <circle cx="65" cy="60" r="3" fill="#F59E0B" filter="url(#uele-bloom)"/>
    <circle cx="70" cy="35" r="3" fill="#C084FC" filter="url(#uele-bloom)"/>
  </g>

  <!-- Left Holographic Floating Code Window -->
  <g transform="translate(30, 80)">
    <rect width="50" height="35" rx="4" fill="#0F172A" fill-opacity="0.85" stroke="#38BDF8" stroke-width="1"/>
    <line x1="8" y1="10" x2="35" y2="10" stroke="#00F0FF" stroke-width="1.5"/>
    <line x1="8" y1="18" x2="42" y2="18" stroke="#94A3B8" stroke-width="1"/>
    <line x1="8" y1="26" x2="28" y2="26" stroke="#10B981" stroke-width="1"/>
  </g>

  <!-- Right Holographic Telemetry Window -->
  <g transform="translate(240, 75)">
    <rect width="50" height="35" rx="4" fill="#0F172A" fill-opacity="0.85" stroke="#34D399" stroke-width="1"/>
    <path d="M 8 25 L 18 15 L 28 22 L 42 10" fill="none" stroke="#34D399" stroke-width="1.5"/>
  </g>
</svg>
