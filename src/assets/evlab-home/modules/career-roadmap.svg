<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <radialGradient id="mod-road-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#00F0FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <filter id="road-bloom">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="320" height="200" fill="#0A101D" rx="12"/>
  <circle cx="160" cy="100" r="100" fill="url(#mod-road-glow)"/>

  <!-- Glowing 3D Branching Career Roadmap Pathway -->
  <!-- Base Pedestal Ring -->
  <ellipse cx="70" cy="140" rx="45" ry="18" fill="#0E1729" stroke="#8B5CF6" stroke-width="1.5"/>
  <circle cx="70" cy="140" r="6" fill="#8B5CF6" filter="url(#road-bloom)"/>

  <!-- Main Arterial Path -->
  <path d="M 70 140 Q 130 90 190 120 T 280 60" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round" filter="url(#road-bloom)"/>
  <path d="M 70 140 Q 130 90 190 120 T 280 60" fill="none" stroke="#E9D5FF" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Branching Track 1 -->
  <path d="M 130 115 Q 160 65 240 50" fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" filter="url(#road-bloom)"/>
  <!-- Branching Track 2 -->
  <path d="M 190 120 Q 230 150 290 140" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" filter="url(#road-bloom)"/>

  <!-- Milestone Nodes -->
  <!-- Node 1 (Foundation) -->
  <g transform="translate(70, 140)">
    <circle r="9" fill="#0F172A" stroke="#C084FC" stroke-width="2"/>
    <circle r="4" fill="#C084FC"/>
  </g>

  <!-- Node 2 (Intermediate) -->
  <g transform="translate(130, 115)">
    <circle r="7" fill="#0F172A" stroke="#00F0FF" stroke-width="2"/>
    <circle r="3" fill="#00F0FF"/>
  </g>

  <!-- Node 3 (Specialist) -->
  <g transform="translate(190, 120)">
    <circle r="8" fill="#0F172A" stroke="#C084FC" stroke-width="2"/>
    <circle r="3.5" fill="#C084FC"/>
  </g>

  <!-- Node 4 (Principal / Lead) -->
  <g transform="translate(240, 50)">
    <circle r="8" fill="#0F172A" stroke="#00F0FF" stroke-width="2"/>
    <circle r="3.5" fill="#00F0FF"/>
  </g>

  <!-- Node 5 (Mastery) -->
  <g transform="translate(280, 60)">
    <circle r="10" fill="#0F172A" stroke="#FDE047" stroke-width="2"/>
    <circle r="5" fill="#FDE047" filter="url(#road-bloom)"/>
  </g>

  <!-- Node 6 (Cross-Discipline) -->
  <g transform="translate(290, 140)">
    <circle r="8" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
    <circle r="3.5" fill="#10B981"/>
  </g>
</svg>
