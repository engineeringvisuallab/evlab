<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <radialGradient id="mod-res-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#00F0FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <filter id="res-bloom">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="320" height="200" fill="#0A101D" rx="12"/>
  <circle cx="160" cy="100" r="100" fill="url(#mod-res-glow)"/>

  <!-- Base Blueprint Table Mat -->
  <polygon points="40,160 160,120 280,160 160,195" fill="#0D1F3C" stroke="#00F0FF" stroke-width="1.5"/>
  <line x1="80" y1="145" x2="200" y2="175" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Stack of 3D Technical Books & Code Volumes -->
  <g transform="translate(60, 80)">
    <!-- Book 1 (Bottom ISO Standards) -->
    <polygon points="15,40 70,20 115,35 60,55" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <polygon points="15,40 60,55 60,65 15,50" fill="#78350F" stroke="#F59E0B" stroke-width="1.2"/>

    <!-- Book 2 (Middle AWWA Manual) -->
    <polygon points="20,25 75,5 120,20 65,40" fill="#1E293B" stroke="#00F0FF" stroke-width="1.5"/>
    <polygon points="20,25 65,40 65,50 20,35" fill="#0369A1" stroke="#00F0FF" stroke-width="1.2"/>

    <!-- Book 3 (Top Design Guide) -->
    <polygon points="25,10 80,-10 125,5 70,25" fill="#1E293B" stroke="#34D399" stroke-width="1.5"/>
    <polygon points="25,10 70,25 70,35 25,20" fill="#064E3B" stroke="#34D399" stroke-width="1.2"/>
  </g>

  <!-- Rolled CAD/BIM Blueprint Drawing Sheet -->
  <g transform="translate(180, 50)" filter="url(#res-bloom)">
    <!-- Unfurled Drawing -->
    <polygon points="10,20 60,0 95,20 45,40" fill="#0C4A6E" stroke="#00F0FF" stroke-width="1.5"/>
    <line x1="25" y1="20" x2="70" y2="10" stroke="#BAE6FD" stroke-width="1.2"/>
    <line x1="35" y1="28" x2="80" y2="18" stroke="#BAE6FD" stroke-width="1.2"/>
    <!-- Technical Compass Tool -->
    <path d="M 50 15 L 60 5 L 70 25" fill="none" stroke="#FDE047" stroke-width="2"/>
    <circle cx="60" cy="5" r="2" fill="#FDE047"/>
  </g>
</svg>
