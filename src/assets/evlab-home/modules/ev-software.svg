<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <radialGradient id="mod-soft-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-bloom">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="320" height="200" fill="#0A101D" rx="12"/>
  <circle cx="160" cy="100" r="100" fill="url(#mod-soft-glow)"/>

  <!-- Pedestal Base Plate -->
  <ellipse cx="160" cy="165" rx="85" ry="24" fill="#0B1C33" stroke="#00F0FF" stroke-width="1.5"/>

  <!-- Floating Holographic CAD / CAE Window -->
  <g transform="translate(60, 40)" filter="url(#soft-bloom)">
    <rect width="140" height="90" rx="6" fill="#0F172A" fill-opacity="0.9" stroke="#00F0FF" stroke-width="1.5"/>
    <line x1="0" y1="20" x2="140" y2="20" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="12" cy="10" r="3" fill="#F43F5E"/>
    <circle cx="22" cy="10" r="3" fill="#FDE047"/>
    <circle cx="32" cy="10" r="3" fill="#10B981"/>

    <!-- 3D Mesh Wireframe Cube Inside CAD Canvas -->
    <g transform="translate(45, 30)">
      <polygon points="25,0 45,10 25,20 5,10" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
      <polygon points="5,10 25,20 25,40 5,30" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
      <polygon points="25,20 45,10 45,30 25,40" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
      <!-- Dimension Callout -->
      <line x1="0" y1="10" x2="0" y2="30" stroke="#00F0FF" stroke-width="1" stroke-dasharray="2 2"/>
      <line x1="0" y1="20" x2="5" y2="20" stroke="#00F0FF" stroke-width="1"/>
    </g>
  </g>

  <!-- Layered Overlay Floating GIS / Pipeline Simulation Window -->
  <g transform="translate(150, 70)">
    <rect width="120" height="75" rx="6" fill="#091829" fill-opacity="0.95" stroke="#34D399" stroke-width="1.5"/>
    <path d="M 15 50 Q 45 25 75 40 T 105 20" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
    <circle cx="45" cy="33" r="3" fill="#00F0FF"/>
    <circle cx="75" cy="40" r="3" fill="#F59E0B"/>
    <circle cx="105" cy="20" r="3" fill="#C084FC"/>
  </g>
</svg>
